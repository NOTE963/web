<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ブラウザ同時視聴</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0e1219; --panel:#161c27; --panel2:#1d2534; --line:#2b3548;
    --text:#eaeef6; --mute:#8f9bb3; --accent:#7cc4ff; --accent-ink:#06121f; --danger:#ff7a6b; --live:#ff5d73;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--text);
    font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    -webkit-text-size-adjust:100%}
  button,input{font:inherit;color:inherit}
  .hidden{display:none !important}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  input[type=text]{
    width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;
    padding:12px 14px;font-size:16px;
  }
  input::placeholder{color:#66738d}
  .btn{
    border:0;border-radius:10px;padding:12px 18px;font-weight:700;cursor:pointer;
    background:var(--accent);color:var(--accent-ink);white-space:nowrap;
  }
  .btn:hover{filter:brightness(1.08)}
  .btn:disabled{opacity:.45;cursor:default;filter:none}
  .btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
  .btn.ghost:hover:not(:disabled){border-color:var(--accent)}
  .btn.live{background:var(--live);color:#2a0710}
  .btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger)}
  .btn.danger.armed{background:var(--danger);color:#2a0905}

  /* ---------- lobby ---------- */
  #lobby{min-height:100dvh;display:grid;place-items:center;padding:24px 16px}
  .lobby-card{width:100%;max-width:440px}
  .lobby-card h1{font-size:34px;line-height:1.2;margin:0 0 6px;letter-spacing:.02em}
  .lobby-card .sub{margin:0 0 26px;color:var(--mute);line-height:1.7;font-size:14px}
  label{display:block;font-size:13px;color:var(--mute);margin:0 0 6px}
  .field{margin-bottom:16px}
  .join-btn{width:100%;font-size:16px;padding:14px}
  .rooms-title{margin:34px 0 10px;font-size:14px;color:var(--mute);font-weight:500}
  .room-list{display:flex;flex-wrap:wrap;gap:8px;min-height:40px}
  .room-chip{
    background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:8px 14px;
    cursor:pointer;font-size:14px;display:flex;gap:8px;align-items:center;
  }
  .room-chip:hover{border-color:var(--accent)}
  .room-chip small{color:var(--mute)}
  .empty{color:#66738d;font-size:14px;padding:8px 0}
  .wipe-row{margin-top:34px;padding-top:18px;border-top:1px solid var(--line);
    display:flex;justify-content:space-between;align-items:center;gap:12px}
  .wipe-row span{font-size:12px;color:var(--mute);line-height:1.5}

  /* ---------- room ---------- */
  #roomView{display:flex;flex-direction:column;height:100dvh}
  .topbar{display:flex;align-items:center;gap:12px;padding:12px 16px;
    padding-top:calc(12px + env(safe-area-inset-top,0px))}
  .topbar .title{min-width:0;flex:1}
  .topbar strong{display:block;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .topbar small{color:var(--mute);font-size:12px}
  .layout{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;
    padding:0 16px calc(16px + env(safe-area-inset-bottom,0px))}
  .main-col{min-height:0;overflow-y:auto;padding:4px 4px 8px;display:flex;flex-direction:column;gap:14px}

  .stage{
    position:relative;aspect-ratio:16/9;width:100%;background:#05070b;border-radius:14px;overflow:hidden;
    box-shadow:0 0 0 1px var(--line),0 24px 70px -24px rgba(124,196,255,.35);
    flex:none;
  }
  .stage.live{box-shadow:0 0 0 2px var(--live),0 24px 70px -24px rgba(255,93,115,.45)}
  #remote{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
  .stage-msg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;
    color:var(--mute);padding:20px;line-height:1.8;font-size:15px;pointer-events:none}

  .controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .status{font-size:13px;color:var(--mute);margin-left:4px}
  .status.on{color:var(--live)}

  .seats{display:flex;flex-wrap:wrap;gap:8px}
  .seat{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);
    border-radius:999px;padding:4px 12px 4px 4px;font-size:13px;max-width:100%}
  .seat.me{border-color:var(--accent)}
  .seat.host{border-color:var(--live)}
  .seat .dot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;
    font-weight:700;font-size:13px;color:#0b1220;flex:none}
  .seat .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .seat .tag{font-size:11px;color:var(--live);font-weight:700}

  .info{font-size:12px;color:var(--mute);line-height:1.8;margin:0}

  .chat{min-height:0;display:flex;flex-direction:column;background:var(--panel);
    border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .chat h2{margin:0;padding:12px 14px;font-size:14px;font-weight:700;border-bottom:1px solid var(--line)}
  #log{flex:1;min-height:0;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
  .msg{font-size:14px;line-height:1.55;word-break:break-word}
  .msg b{color:var(--accent);margin-right:6px;font-weight:700}
  .msg.mine b{color:#ffd38a}
  .chat-form{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}

  .toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
    background:#f2f5fb;color:#0d1420;padding:10px 16px;border-radius:10px;font-size:14px;z-index:50;
    max-width:calc(100vw - 32px);box-shadow:0 10px 30px rgba(0,0,0,.4)}

  @media (max-width:860px){
    .layout{grid-template-columns:1fr;overflow-y:auto;gap:12px}
    .main-col{overflow:visible;flex:none}
    .chat{height:340px;flex:none}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
</style>
</head>
<body>

<!-- ============ ロビー ============ -->
<div id="lobby">
  <div class="lobby-card">
    <h1>ブラウザ同時視聴</h1>
    <p class="sub">ブラウザの画面を共有して、同じ画面をみんなで見られます。共有するのは別のブラウザのウィンドウでもOK。</p>

    <form id="joinForm" autocomplete="off">
      <div class="field">
        <label for="nameInput">ユーザー名</label>
        <input id="nameInput" type="text" maxlength="16" placeholder="例：たろう" required>
      </div>
      <div class="field">
        <label for="roomInput">ルーム名</label>
        <input id="roomInput" type="text" maxlength="30" placeholder="新しい名前なら自動でルームができます" required>
      </div>
      <button class="btn join-btn" id="joinBtn" type="submit">入室する</button>
    </form>

    <h2 class="rooms-title">いまあるルーム（タップで入力）</h2>
    <div class="room-list" id="roomList"><div class="empty">読み込み中…</div></div>

    <div class="wipe-row">
      <span>全員のルーム・チャット・共有状態を<br>まとめて消します</span>
      <button class="btn danger" id="wipeBtn" type="button">ルーム全削除</button>
    </div>
  </div>
</div>

<!-- ============ ルーム ============ -->
<div id="roomView" class="hidden">
  <div class="topbar">
    <button class="btn ghost" id="leaveBtn" type="button">退室</button>
    <div class="title">
      <strong id="roomTitle"></strong>
      <small id="countText"></small>
    </div>
  </div>

  <div class="layout">
    <section class="main-col">
      <div class="stage" id="stage">
        <video id="remote" autoplay playsinline></video>
        <div class="stage-msg" id="stageMsg"></div>
      </div>

      <div class="controls">
        <button class="btn" id="shareBtn" type="button">画面を共有する</button>
        <button class="btn ghost" id="soundBtn" type="button">音を出す</button>
        <button class="btn ghost" id="fsBtn" type="button">全画面</button>
        <span class="status" id="status"></span>
      </div>

      <div class="seats" id="seats"></div>

      <p class="info">
        見せたい側が「画面を共有する」を押し、ブラウザのダイアログで<b>タブ</b>か<b>ウィンドウ</b>を選びます。
        別のブラウザで開いたGoogleを見せたいときは「ウィンドウ」から選んでください。
        タブ共有なら「タブの音声も共有」にチェックで音も届きます。共有できるのは同時に1人です。
      </p>
    </section>

    <aside class="chat">
      <h2>チャット</h2>
      <div id="log"></div>
      <form class="chat-form" id="chatForm" autocomplete="off">
        <input id="chatInput" type="text" maxlength="300" placeholder="メッセージ">
        <button class="btn" type="submit">送信</button>
      </form>
    </aside>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
// ================= Firebase =================
const firebaseConfig = {
  apiKey: "AIzaSyAqe24qeS_gYtMA_gnF_lYNP70keCQcpnA",
  authDomain: "renritu-56ae7.firebaseapp.com",
  databaseURL: "https://renritu-56ae7-default-rtdb.firebaseio.com",
  projectId: "renritu-56ae7",
  storageBucket: "renritu-56ae7.firebasestorage.app",
  messagingSenderId: "327969979771",
  appId: "1:327969979771:web:709a0fc2a281dc495e91de",
  measurementId: "G-VFLGB9QXR3"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const ROOT = db.ref('browserWatch/rooms');     // 全削除はこの配下だけ消える
const TS = firebase.database.ServerValue.TIMESTAMP;

const RTC_CFG = { iceServers: [{ urls: ['stun:stun.l.google.com:19302', 'stun:stun1.l.google.com:19302'] }] };
const MAX_BITRATE = 3000000; // 共有映像の上限（視聴者1人あたり）

// 自分のID（タブごと）
let uid = null;
try { uid = sessionStorage.getItem('bw_uid'); } catch (e) {}
if (!uid) {
  uid = 'u' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
  try { sessionStorage.setItem('bw_uid', uid); } catch (e) {}
}

const $ = s => document.querySelector(s);
const S = {
  ref: null, me: null, key: '', name: '', listeners: [],
  members: {}, host: null,
  localStream: null, peers: {},                       // 共有する側
  viewerPc: null, viewerSid: null, vReady: false, vPending: [], lastOffer: null, vState: ''  // 見る側
};

// ================= 共通 =================
let toastT;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.remove('hidden');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.add('hidden'), 3600);
}
function hue(str) { let h = 0; for (const c of str) h = (h * 31 + c.charCodeAt(0)) % 360; return h; }
function listen(ref, ev, cb) { ref.on(ev, cb); S.listeners.push([ref, ev, cb]); }
const dbError = () => toast('データベースに接続できません。Realtime Databaseのルールを確認してください');
const cand = c => JSON.parse(JSON.stringify(c.toJSON ? c.toJSON() : c));

// ================= ロビー =================
try { $('#nameInput').value = localStorage.getItem('bw_name') || ''; } catch (e) {}

let lobbyOn = false;
function startLobby() {
  stopLobby(); lobbyOn = true;
  ROOT.on('value', snap => {
    const box = $('#roomList'); box.innerHTML = '';
    const val = snap.val();
    const keys = val ? Object.keys(val).filter(k => val[k] && val[k].meta) : [];
    if (!keys.length) { box.innerHTML = '<div class="empty">まだルームがありません。好きな名前で作れます。</div>'; return; }
    keys.forEach(k => {
      const v = val[k];
      const n = v.members ? Object.keys(v.members).length : 0;
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'room-chip';
      const nm = document.createElement('span'); nm.textContent = v.meta.name || k;
      const sm = document.createElement('small'); sm.textContent = n + '人';
      b.append(nm, sm);
      b.onclick = () => { $('#roomInput').value = v.meta.name || k; $('#nameInput').focus(); };
      box.appendChild(b);
    });
  }, dbError);
}
function stopLobby() { if (lobbyOn) { ROOT.off('value'); lobbyOn = false; } }

// ルーム全削除（2度押し）
let wipeArmed = false, wipeT;
$('#wipeBtn').onclick = async () => {
  const b = $('#wipeBtn');
  if (!wipeArmed) {
    wipeArmed = true; b.classList.add('armed'); b.textContent = 'もう一度押すと削除';
    wipeT = setTimeout(resetWipe, 4000); return;
  }
  clearTimeout(wipeT); resetWipe();
  try { await ROOT.remove(); toast('すべてのルームを削除しました'); }
  catch (e) { dbError(); }
};
function resetWipe() {
  wipeArmed = false; const b = $('#wipeBtn'); b.classList.remove('armed'); b.textContent = 'ルーム全削除';
}

$('#joinForm').addEventListener('submit', e => { e.preventDefault(); joinRoom(); });

async function joinRoom() {
  const name = $('#nameInput').value.trim().slice(0, 16);
  const roomName = $('#roomInput').value.trim().slice(0, 30);
  const key = roomName.replace(/[.#$\[\]\/]/g, '_');
  if (!name || !key) { toast('ユーザー名とルーム名を入力してください'); return; }
  try { localStorage.setItem('bw_name', name); } catch (e) {}

  const btn = $('#joinBtn'); btn.disabled = true;
  const ref = ROOT.child(key);
  try {
    await ref.child('meta').transaction(cur => cur || { name: roomName, createdAt: Date.now() });
  } catch (err) { dbError(); btn.disabled = false; return; }
  btn.disabled = false;

  stopLobby();
  Object.assign(S, { ref, key, name, members: {}, host: null, lastOffer: null, viewerSid: null, vReady: false, vPending: [], vState: '' });
  S.me = ref.child('members/' + uid);
  S.me.onDisconnect().remove();
  S.me.set({ name, at: TS });

  $('#lobby').classList.add('hidden');
  $('#roomView').classList.remove('hidden');
  $('#log').innerHTML = '';
  showIdle(); updateStatus();

  let seenMeta = false;
  listen(ref.child('meta'), 'value', s => {
    if (s.exists()) { seenMeta = true; $('#roomTitle').textContent = s.val().name || key; }
    else if (seenMeta) leaveRoom('ルームが削除されました');
  });
  listen(ref.child('members'), 'value', s => onMembers(s.val() || {}));
  listen(ref.child('host'), 'value', s => onHost(s.val()));
  listen(ref.child('rtc/' + uid + '/offer'), 'value', s => { S.lastOffer = s.val(); tryOffer(); });
  listen(ref.child('rtc/' + uid + '/hc'), 'child_added', s => onHostCandidate(s.val()));
  listen(ref.child('chat').limitToLast(60), 'child_added', s => addChat(s.val()));
}

function leaveRoom(msg) {
  if (!S.ref) return;
  stopShare();
  closeViewer(true);
  S.listeners.forEach(([r, e, c]) => r.off(e, c)); S.listeners = [];
  try { S.me.onDisconnect().cancel(); S.me.remove(); } catch (e) {}
  S.ref = null; S.me = null; S.host = null; S.members = {};
  $('#roomView').classList.add('hidden');
  $('#lobby').classList.remove('hidden');
  startLobby();
  if (msg) toast(msg);
}
$('#leaveBtn').onclick = () => leaveRoom();

// ================= メンバー・チャット =================
function onMembers(val) {
  S.members = val;
  renderSeats();
  if (S.localStream) {
    for (const [id, m] of Object.entries(val)) {
      if (id === uid) continue;
      const p = S.peers[id];
      if (!p || p.at !== m.at) connectViewer(id, m.at);
    }
    for (const id of Object.keys(S.peers)) if (!val[id]) closePeer(id);
  }
  updateStatus();
}

function renderSeats() {
  const arr = Object.entries(S.members).map(([id, m]) => ({ id, name: m.name || '?', at: m.at || 0 }))
    .sort((a, b) => a.at - b.at);
  $('#countText').textContent = arr.length + '人が参加中';
  const box = $('#seats'); box.innerHTML = '';
  arr.forEach(m => {
    const isHost = S.host && S.host.id === m.id;
    const d = document.createElement('div');
    d.className = 'seat' + (m.id === uid ? ' me' : '') + (isHost ? ' host' : ''); d.title = m.name;
    const dot = document.createElement('span'); dot.className = 'dot';
    dot.style.background = `hsl(${hue(m.name)} 65% 68%)`; dot.textContent = [...m.name][0];
    const nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = m.name + (m.id === uid ? '（自分）' : '');
    d.append(dot, nm);
    if (isHost) { const t = document.createElement('span'); t.className = 'tag'; t.textContent = '共有中'; d.appendChild(t); }
    box.appendChild(d);
  });
}

function addChat(m) {
  if (!m) return;
  const log = $('#log');
  const near = log.scrollHeight - log.scrollTop - log.clientHeight < 80;
  const d = document.createElement('div'); d.className = 'msg' + (m.id === uid ? ' mine' : '');
  const b = document.createElement('b'); b.textContent = m.name || '?';
  const t = document.createElement('span'); t.textContent = m.text || '';
  d.append(b, t); log.appendChild(d);
  if (near || m.id === uid) log.scrollTop = log.scrollHeight;
}
$('#chatForm').addEventListener('submit', e => {
  e.preventDefault();
  const inp = $('#chatInput'); const text = inp.value.trim().slice(0, 300);
  if (!text || !S.ref) return;
  S.ref.child('chat').push({ id: uid, name: S.name, text, at: TS }).catch(dbError);
  inp.value = '';
});

// ================= 表示まわり =================
function setStage(text) {
  const m = $('#stageMsg');
  if (text) { m.textContent = text; m.classList.remove('hidden'); } else m.classList.add('hidden');
}
function showIdle() {
  const v = $('#remote');
  if (!S.localStream) { v.srcObject = null; }
  $('#stage').classList.remove('live');
  setStage('まだ誰も共有していません。「画面を共有する」を押すと、ここに表示されます');
}

function updateStatus() {
  const btn = $('#shareBtn'), st = $('#status'), h = S.host;
  st.classList.remove('on');
  if (S.localStream) {
    btn.textContent = '共有を止める'; btn.className = 'btn live'; btn.disabled = false;
    const total = Object.keys(S.peers).length;
    const ok = Object.values(S.peers).filter(p => p.pc.connectionState === 'connected').length;
    st.textContent = `共有中（視聴 ${ok}/${total}人）`; st.classList.add('on');
  } else if (h) {
    btn.textContent = '画面を共有する'; btn.className = 'btn'; btn.disabled = true;
    st.textContent = `${h.name}さんの画面：${S.vState || '接続待ち…'}`;
  } else {
    btn.textContent = '画面を共有する'; btn.className = 'btn'; btn.disabled = false;
    st.textContent = '';
  }
  updateSoundBtn();
}

function updateSoundBtn() {
  const v = $('#remote'), b = $('#soundBtn');
  const viewing = !S.localStream && v.srcObject;
  b.classList.toggle('hidden', !viewing);
  b.textContent = v.muted ? '音を出す' : '音を消す';
}
$('#soundBtn').onclick = async () => {
  const v = $('#remote'); v.muted = !v.muted;
  if (!v.muted) { try { await v.play(); } catch (e) {} }
  updateSoundBtn();
};
$('#fsBtn').onclick = () => { const s = $('#stage'); (s.requestFullscreen || s.webkitRequestFullscreen || (() => {})).call(s); };

// ================= 共有する側 =================
$('#shareBtn').onclick = () => { if (S.localStream) stopShare(); else startShare(); };

async function startShare() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) {
    toast('この端末では画面共有を開始できません。PCのブラウザで開いてください'); return;
  }
  let stream;
  try { stream = await navigator.mediaDevices.getDisplayMedia({ video: { frameRate: { ideal: 30 } }, audio: true }); }
  catch (e) { return; } // キャンセル

  S.localStream = stream;
  const vt = stream.getVideoTracks()[0];
  if (vt) { try { vt.contentHint = 'detail'; } catch (e) {} vt.onended = () => stopShare(); }

  let res;
  try {
    res = await S.ref.child('host').transaction(cur => (cur && cur.id !== uid) ? undefined : { id: uid, name: S.name, at: Date.now() });
  } catch (e) { dbError(); res = { committed: false }; }
  if (!res.committed) {
    const other = res.snapshot && res.snapshot.val();
    stream.getTracks().forEach(t => t.stop()); S.localStream = null;
    if (other) toast(`${other.name}さんが共有中です`);
    updateStatus(); return;
  }
  S.ref.child('host').onDisconnect().remove();

  const v = $('#remote'); v.muted = true; v.srcObject = stream; v.play().catch(() => {});
  setStage(null); $('#stage').classList.add('live');
  for (const [id, m] of Object.entries(S.members)) if (id !== uid) connectViewer(id, m.at);
  updateStatus();
}

function stopShare() {
  if (!S.localStream) return;
  S.localStream.getTracks().forEach(t => { t.onended = null; t.stop(); });
  S.localStream = null;
  Object.keys(S.peers).forEach(closePeer);
  const ref = S.ref;
  if (ref) {
    ref.child('host').onDisconnect().cancel();
    ref.child('host').transaction(cur => (cur && cur.id === uid) ? null : undefined).catch(() => {});
    ref.child('rtc').remove().catch(() => {});
  }
  $('#remote').srcObject = null; $('#remote').muted = false;
  showIdle(); updateStatus();
}

function closePeer(vid) {
  const p = S.peers[vid]; if (!p) return;
  p.unsubs.forEach(([r, e, c]) => r.off(e, c));
  try { p.pc.close(); } catch (e) {}
  delete S.peers[vid];
  updateStatus();
}

function tuneBitrate(pc) {
  pc.getSenders().forEach(s => {
    if (!s.track || s.track.kind !== 'video') return;
    try {
      const p = s.getParameters();
      if (!p.encodings || !p.encodings.length) p.encodings = [{}];
      p.encodings[0].maxBitrate = MAX_BITRATE;
      p.degradationPreference = 'maintain-resolution';
      s.setParameters(p).catch(() => {});
    } catch (e) {}
  });
}

async function connectViewer(vid, at) {
  closePeer(vid);
  const sid = Math.random().toString(36).slice(2, 10);
  const pc = new RTCPeerConnection(RTC_CFG);
  const peer = { pc, sid, at, unsubs: [], pending: [], answered: false, ready: false };
  S.peers[vid] = peer;
  const alive = () => S.peers[vid] === peer && S.localStream;
  const base = S.ref.child('rtc/' + vid);

  S.localStream.getTracks().forEach(t => pc.addTrack(t, S.localStream));

  pc.onicecandidate = e => { if (e.candidate && alive()) base.child('hc').push({ sid, c: cand(e.candidate) }); };
  pc.onconnectionstatechange = () => {
    if (pc.connectionState === 'connected') tuneBitrate(pc);
    if (pc.connectionState === 'failed') {
      const m = S.members[vid]; toast(`${m ? m.name : '視聴者'}さんと接続できませんでした（ネットワーク制限の可能性）`);
    }
    updateStatus();
  };

  try {
    await base.remove();
    if (!alive()) return;

    const ansRef = base.child('answer');
    const ansCb = async s => {
      const v = s.val();
      if (!v || v.sid !== sid || peer.answered) return;
      peer.answered = true;
      try {
        await pc.setRemoteDescription({ type: 'answer', sdp: v.sdp });
        peer.ready = true;
        peer.pending.forEach(c => pc.addIceCandidate(c).catch(() => {})); peer.pending = [];
      } catch (e) {}
    };
    ansRef.on('value', ansCb); peer.unsubs.push([ansRef, 'value', ansCb]);

    const vcRef = base.child('vc');
    const vcCb = s => {
      const v = s.val(); if (!v || v.sid !== sid) return;
      if (peer.ready) pc.addIceCandidate(v.c).catch(() => {}); else peer.pending.push(v.c);
    };
    vcRef.on('child_added', vcCb); peer.unsubs.push([vcRef, 'child_added', vcCb]);

    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    if (!alive()) return;
    await base.child('offer').set({ sid, from: uid, sdp: offer.sdp });
  } catch (e) { console.error(e); }
  updateStatus();
}

// ================= 見る側 =================
function onHost(h) {
  S.host = h || null;
  if (h && h.id === uid && !S.localStream) {           // 前回セッションの残り
    S.ref.child('host').remove().catch(() => {}); return;
  }
  if (!h) {
    if (S.localStream) stopShare();
    closeViewer(); showIdle();
  } else if (h.id !== uid) {
    if (S.localStream) stopShare();
    if (!S.viewerPc) { S.vState = '接続待ち…'; setStage('接続しています…'); }
    tryOffer();
  }
  renderSeats(); updateStatus();
}

function tryOffer() {
  const o = S.lastOffer, h = S.host;
  if (!o || !h || h.id === uid || o.from !== h.id || S.localStream) return;
  if (S.viewerSid === o.sid) return;
  acceptOffer(o);
}

async function acceptOffer(o) {
  closeViewer();
  S.viewerSid = o.sid; S.vReady = false;
  const pc = new RTCPeerConnection(RTC_CFG); S.viewerPc = pc;
  const cur = () => S.viewerPc === pc;

  pc.ontrack = e => {
    if (!cur()) return;
    const v = $('#remote');
    if (v.srcObject !== e.streams[0]) v.srcObject = e.streams[0];
    setStage(null); $('#stage').classList.add('live');
    playRemote();
  };
  pc.onicecandidate = e => {
    if (e.candidate && cur()) S.ref.child('rtc/' + uid + '/vc').push({ sid: o.sid, c: cand(e.candidate) });
  };
  pc.onconnectionstatechange = () => {
    if (!cur()) return;
    const st = pc.connectionState;
    S.vState = st === 'connected' ? '視聴中' : st === 'failed' ? '接続に失敗（ネットワーク制限の可能性）' : st === 'disconnected' ? '再接続中…' : '接続中…';
    if (st === 'failed') toast('接続に失敗しました。別のネットワークで試すか、TURNサーバーの設定が必要かもしれません');
    updateStatus();
  };

  try {
    await pc.setRemoteDescription({ type: 'offer', sdp: o.sdp });
    if (!cur()) return;
    S.vReady = true;
    S.vPending.filter(x => x.sid === o.sid).forEach(x => pc.addIceCandidate(x.c).catch(() => {}));
    S.vPending = [];
    const ans = await pc.createAnswer();
    await pc.setLocalDescription(ans);
    if (!cur()) return;
    await S.ref.child('rtc/' + uid + '/answer').set({ sid: o.sid, sdp: ans.sdp });
  } catch (e) { console.error(e); }
}

function onHostCandidate(v) {
  if (!v) return;
  if (S.vReady && v.sid === S.viewerSid && S.viewerPc) S.viewerPc.addIceCandidate(v.c).catch(() => {});
  else if (S.vPending.length < 200) S.vPending.push({ sid: v.sid, c: v.c });
}

function closeViewer(force) {
  if (S.viewerPc) { try { S.viewerPc.close(); } catch (e) {} }
  S.viewerPc = null; S.viewerSid = null; S.vReady = false; S.vPending = []; S.vState = '';
  if (!S.localStream) { $('#remote').srcObject = null; $('#stage').classList.remove('live'); }
  if (force) updateSoundBtn();
}

async function playRemote() {
  const v = $('#remote');
  v.muted = false;
  try { await v.play(); }
  catch (e) { v.muted = true; try { await v.play(); } catch (e2) {} toast('音声はブラウザにブロックされました。「音を出す」を押してください'); }
  updateSoundBtn();
}

// ================= 起動 =================
startLobby();
window.addEventListener('beforeunload', () => { try { if (S.me) S.me.remove(); } catch (e) {} });
</script>
